# Pull request checks: build and test only what the change can affect,
# from Turborepo's graph against the merge base.
type: workflow
stages:
  - test
jobs:
  affected:
    # A build over the whole workspace (pnpm and turbo read every
    # package): a revision with the same tree as an earlier pass reuses it.
    # What it builds and tests is chosen against the merge base; history
    # stays complete for it.
    job_type: build
    stage: test
    checkout: true
    image: node:22-bookworm@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
    script: |
      corepack enable
      pnpm install --frozen-lockfile
      export TURBO_SCM_BASE=$(git merge-base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD)
      pnpm turbo run build test --affected
