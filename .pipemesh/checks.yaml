# Pull request checks: build and test every package. No merge base is
# needed, and the checkout stays one commit deep.
type: workflow
stages:
  - test
jobs:
  affected:
    # A build over the whole workspace (pnpm and turbo read every
    # package): a revision with the same tree as an earlier pass reuses it.
    # No remote cache: Vercel's token would let proposed code write what
    # the default branch's builds read.
    job_type: build
    stage: test
    checkout: true
    image: node:22-bookworm@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
    script: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm turbo run build test
