# A Turborepo monorepo on PipeMesh: one dispatch pipeline fans each
# revision out to a pipeline per service, and a service's pipeline
# receives the revision only when Turborepo's task graph says the change
# can affect it.
#
# How: the graph job fingerprints every service from Turborepo's own task
# hashes (turbo/fingerprint@1, `turbo run build --dry=json`) and
# produces one entry per service. Each dispatch job consumes its service's
# entry and dispatches when it changed since that job last dispatched — so
# a service that sat out ten commits still sees all ten when the next one
# changes it, and a README or a sibling's change reaches no one.

service: !include .pipemesh/service.yaml

dispatch:
  stages: [graph, dispatch]
  jobs:
    graph:
      stage: graph
      # Turborepo's own task hashes, one file per service (turbo/fingerprint@1).
      uses: turbo/fingerprint@1
      with:
        image: node:22-bookworm@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
        install: corepack enable && pnpm install --frozen-lockfile
        turbo: pnpm -s turbo
        deployables: services/
        # What the task hashes cannot see: how each service ships.
        extra: .pipemesh/service.yaml deploy
      produces:
        orders: fingerprints/orders
        payments: fingerprints/payments
        inventory: fingerprints/inventory
        notifications: fingerprints/notifications
        catalog: fingerprints/catalog

    orders:
      stage: dispatch
      consumes: [graph/orders]
      paths: []   # reads only the entry it consumes
      delegate:
        type: pipeline
        params: { body: !ref service, variables: { SERVICE: orders } }
    payments:
      stage: dispatch
      consumes: [graph/payments]
      paths: []   # reads only the entry it consumes
      delegate:
        type: pipeline
        params: { body: !ref service, variables: { SERVICE: payments } }
    inventory:
      stage: dispatch
      consumes: [graph/inventory]
      paths: []   # reads only the entry it consumes
      delegate:
        type: pipeline
        params: { body: !ref service, variables: { SERVICE: inventory } }
    notifications:
      stage: dispatch
      consumes: [graph/notifications]
      paths: []   # reads only the entry it consumes
      delegate:
        type: pipeline
        params: { body: !ref service, variables: { SERVICE: notifications } }
    catalog:
      stage: dispatch
      consumes: [graph/catalog]
      paths: []   # reads only the entry it consumes
      delegate:
        type: pipeline
        params: { body: !ref service, variables: { SERVICE: catalog } }

pipemesh:
  pipelines:
    pipeline: !ref dispatch
  workflows:
    checks: { body: !include .pipemesh/checks.yaml, on: pull_request }
